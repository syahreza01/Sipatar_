[env:esp32cam]
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino

upload_speed = 74880
monitor_speed = 74880

board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    ; TAMBAHKAN BARIS DI BAWAH INI:
    -DARDUINO_ESP32S_CAM_AI_THINKER 